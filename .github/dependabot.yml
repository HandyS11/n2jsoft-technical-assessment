# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Groups are matched in order (first match wins); each ecosystem ends with a
# catch-all group so no dependency gets its own PR.

version: 2
updates:
  # NuGet
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      aspire:
        patterns:
          - "Aspire.*"
      aspnetcore-efcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "dotnet-ef"
      analyzers:
        patterns:
          - "Microsoft.CodeAnalysis.*"
          - "Microsoft.VisualStudio.Threading.Analyzers"
          - "Roslynator.*"
          - "SonarAnalyzer.*"
      testing:
        patterns:
          - "xunit*"
          - "Shouldly"
          - "NSubstitute*"
          - "Reqnroll*"
          - "Testcontainers*"
          - "Respawn"
          - "Microsoft.Playwright"
          - "Microsoft.Testing.*"
      nuget-other:
        patterns:
          - "*"

  # No "dotnet-sdk" ecosystem: global.json's version is a floor, not a pin. With `rollForward: latestMinor`, 10.0.100
  # accepts any installed .NET 10 SDK; Dependabot would raise it to the latest one and lock out older .NET 10 SDKs.

  # npm (Angular frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Majors of the Nx-managed toolchain are interdependent and need code
    # migrations, so they go through `npx nx migrate latest` instead.
    ignore:
      - dependency-name: "nx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nx/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@schematics/angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@analogjs/*"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "angular-eslint"
          - "rxjs"
          - "zone.js"
      nx:
        patterns:
          - "nx"
          - "@nx/*"
      vite-vitest:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@analogjs/*"
          - "jsdom"
      eslint-prettier:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "prettier"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "autoprefixer"
      typescript:
        patterns:
          - "typescript"
          - "tslib"
          - "@types/*"
          - "@swc/*"
          - "@swc-node/*"
      npm-other:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
